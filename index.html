<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مجتمع نما الرقمي | NAAMA Digital Community</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>:root{
--p25:#f7fdf9;--p50:#f3fcf6;--p100:#dff6e7;--p200:#b8eacb;--p300:#88d8ad;--p400:#54c08a;--p600:#1b8354;--p700:#166a45;--p800:#14573a;--p900:#104631;--p950:#092a1e;
--gold:#dba102;--gold50:#fffef2;--gold400:#f7d54d;
--n50:#f9fafb;--n100:#f3f4f6;--n200:#e5e7eb;--n300:#d2d6db;--n400:#9da4ae;--n500:#6c737f;--n700:#384250;--n900:#111927;--n950:#0d121c;--black:#161616;
--err50:#fef3f2;--err200:#fecdca;--err600:#d92d20;--err700:#b42318;--warn100:#fef0c7;--warn700:#b54708;--info100:#d1e9ff;--info700:#175cd3;
--svc-bg:#f8f9fa;--r-xs:2px;--r-sm:4px;--r-md:8px;--r-lg:10px;--r-xl:24px;
--font:'IBM Plex Sans Arabic','IBM Plex Sans',Tahoma,Arial,sans-serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--font);font-size:16px;line-height:24px;color:var(--n900);background:var(--svc-bg);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--p700)}
h1,h2,h3,h4{margin:0;font-weight:600;color:var(--n900)}
.sr{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
.wrap{max-width:1152px;margin:0 auto;padding:0 16px;width:100%}
svg.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:middle}
svg.ic.sm{width:16px;height:16px}svg.ic.lg{width:24px;height:24px}svg.ic.xl{width:32px;height:32px}
[dir=ltr] .flip{transform:scaleX(-1)}
/* header */
.topbar{background:var(--n50);border-bottom:1px solid var(--n200);height:45px;font-size:12px;color:var(--n700)}
.topbar .wrap{display:flex;align-items:center;justify-content:space-between;height:45px;max-width:1440px;padding:0 39px}
.topbar .gov{display:flex;align-items:center;gap:8px}
.flag{width:18px;height:12px;background:var(--p600);border-radius:2px;display:inline-block}
.topbar .links{display:flex;align-items:center;gap:20px}
.topbar button,.topbar a{background:none;border:0;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--n700);cursor:pointer;text-decoration:none}
.topbar .out{color:var(--err600)}
.userchip{display:flex;align-items:center;gap:8px}.userchip b{font-weight:600;color:var(--n900)}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:var(--r-full,9999px);font-size:12px;line-height:18px;font-weight:500;background:var(--p100);color:var(--p800)}
.tag.gold{background:var(--warn100);color:var(--warn700)}.tag.gray{background:var(--n100);color:var(--n700)}.tag.blue{background:var(--info100);color:var(--info700)}.tag.red{background:var(--err50);color:var(--err700)}
.mainnav{background:#fff;border-bottom:1px solid var(--n200);height:73px}
.mainnav .wrap{max-width:1440px;padding:0 39px;display:flex;align-items:center;height:73px;gap:24px}
.mainnav .logo{display:flex;align-items:center;cursor:pointer}.mainnav .logo img{height:43px}
.navl{display:flex;align-items:stretch;height:73px;flex:1;gap:4px}
.navl a{display:flex;align-items:center;padding:0 14px;font-size:14px;font-weight:500;color:var(--n700);text-decoration:none;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.navl a:hover{color:var(--p700)}
.navl a.on{background:var(--p600);color:#fff;border-bottom-color:var(--p900)}
.srch{position:relative;width:320px}
.srch input{width:100%;height:40px;border:1px solid var(--n400);border-radius:var(--r-md);padding:0 40px 0 12px;background:#fff;font-size:14px}
[dir=rtl] .srch input{padding:0 12px 0 40px}
.srch svg{position:absolute;top:10px;inset-inline-end:12px;color:var(--n500)}
.subnav{background:#fff;border-bottom:1px solid var(--n200)}
.subnav .wrap{display:flex;gap:4px;overflow-x:auto}
.subnav a{padding:14px 16px;font-size:14px;font-weight:500;color:var(--n500);text-decoration:none;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;display:flex;gap:6px;align-items:center}
.subnav a.on{color:var(--p700);border-bottom-color:var(--p600)}
.subnav a:hover{color:var(--p700)}
.bc{font-size:14px;color:var(--n500);padding:16px 0 0;display:flex;gap:8px;align-items:center}.bc a{cursor:pointer;color:var(--p700);text-decoration:none}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:var(--r-md);border:1px solid transparent;font-weight:500;font-size:16px;background:var(--n100);color:var(--black);white-space:nowrap}
.btn:hover{background:var(--n200)}
.btn.pri{background:var(--p600);color:#fff}.btn.pri:hover{background:var(--p700)}.btn.pri:active{background:var(--p900)}
.btn.out{background:#fff;border-color:var(--n300);color:var(--n900)}.btn.out:hover{background:var(--n50);border-color:var(--n400)}
.btn.prim-out{background:#fff;border-color:var(--p600);color:var(--p700)}.btn.prim-out:hover{background:var(--p50)}
.btn.dng{background:#fff;border-color:var(--err200);color:var(--err700)}.btn.dng:hover{background:var(--err50)}
.btn.dngs{background:var(--err600);color:#fff}
.btn.sm{height:32px;padding:0 12px;font-size:14px}
.btn.block{width:100%}
.btn[disabled],.btn.dis{background:var(--n100);color:var(--n400);border-color:var(--n200);cursor:not-allowed}
.btn:focus-visible,.chip:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--p300);outline-offset:1px}
/* forms */
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.fld label.l{font-size:14px;font-weight:500;color:var(--n700)}
.fld label.l .req{color:var(--err600)}
.inp{height:40px;border:1px solid var(--n400);border-radius:var(--r-md);padding:0 12px;background:#fff;font-size:16px;width:100%}
.inp:hover{border-color:var(--n500)}.inp:focus{border-color:var(--p600);outline:none;box-shadow:0 0 0 3px var(--p100)}
.inp[readonly]{background:var(--n100);color:var(--n700)}
textarea.inp{height:auto;min-height:110px;padding:10px 12px;resize:vertical}
.inp.err{border-color:var(--err600);background:var(--err50)}
.help{font-size:14px;color:var(--n500);line-height:20px;display:flex;gap:4px;align-items:flex-start}
.errm{font-size:14px;color:var(--err600);line-height:20px;display:flex;gap:4px;align-items:center}
.chk{display:flex;align-items:flex-start;gap:10px;cursor:pointer;font-size:16px}
.chk input{width:20px;height:20px;accent-color:var(--p600);margin:2px 0 0;flex:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
/* cards & panels */
.card{background:#fff;border:1px solid var(--n200);border-radius:var(--r-md)}
.card.pad{padding:20px}
.page{padding:24px 0 48px}
.pt{font-size:24px;line-height:32px;margin:0 0 4px}.ps{color:var(--n500);font-size:14px;margin:0 0 20px}
.sec-t{font-size:20px;line-height:28px;margin:0 0 4px;display:flex;align-items:center;gap:8px}
.sec-t:before{content:"";width:4px;height:22px;background:var(--p600);border-radius:2px}
.acc{border:1px solid var(--n300);border-radius:var(--r-md);overflow:hidden;background:#fff;margin-bottom:16px}
.acc>.h{display:flex;align-items:center;justify-content:space-between;background:var(--n100);padding:14px 20px;font-weight:600}
.acc>.b{padding:20px}
.info-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.info{border:1px solid var(--n300);border-radius:var(--r-md);padding:14px 16px;background:var(--n50)}
.info .k{font-size:14px;color:var(--n700)}.info .v{font-size:16px;margin-top:4px;word-break:break-word}
/* hero */
.hero{background:linear-gradient(105deg,var(--p950),var(--p800) 55%,var(--p700));color:#fff;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 85% 20%,rgba(255,255,255,.10),transparent 45%),repeating-linear-gradient(135deg,rgba(255,255,255,.03) 0 2px,transparent 2px 22px);pointer-events:none}
.hero .wrap{display:flex;align-items:center;justify-content:space-between;gap:32px;padding-top:48px;padding-bottom:48px;position:relative;z-index:1}
.hero h1{color:#fff;font-size:36px;line-height:46px;margin-bottom:12px}
.hero p{color:var(--p100);max-width:660px;margin:0 0 20px;line-height:30px}
.hero .art{width:480px;aspect-ratio:3/2;border-radius:var(--r-xl);border:1px solid rgba(255,255,255,.22);overflow:hidden;flex:none;box-shadow:0 18px 40px rgba(0,0,0,.28);background:var(--p800)}
.hero .art img{display:block;width:100%;height:100%;max-width:none;margin:0;border-radius:0;object-fit:cover;object-position:center}
.hero .btn.pri{background:#fff;color:var(--p800)}.hero .btn.pri:hover{background:var(--p50)}
.hero .btn.out{background:transparent;color:#fff;border-color:rgba(255,255,255,.55)}.hero .btn.out:hover{background:rgba(255,255,255,.1)}
.benefits{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin:24px 0;background:#fff;border:1px solid var(--n200);border-radius:var(--r-md)}
.benefit{display:flex;gap:12px;align-items:center;padding:16px;border-inline-start:1px solid var(--n200)}
.benefit:first-child{border:0}.benefit b{display:block;font-weight:600}.benefit small{color:var(--n500);font-size:13px;line-height:18px;display:block}
.benefit .ico{width:44px;height:44px;border-radius:50%;background:var(--p100);color:var(--p700);display:flex;align-items:center;justify-content:center;flex:none}
.content{display:grid;grid-template-columns:minmax(0,3fr) minmax(280px,1fr);gap:16px}
.cards4{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.opp{border:1px solid var(--n200);border-radius:var(--r-md);padding:16px;display:flex;flex-direction:column;min-height:260px;background:#fff}
.opp .hd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.opp h3{font-size:16px;line-height:24px;margin:8px 0}
.opp .meta{font-size:13px;color:var(--n700);line-height:22px;margin-bottom:8px}
.opp .meta div{display:flex;gap:6px;align-items:center}
.opp p{font-size:13px;line-height:20px;color:var(--n500);margin:0 0 12px}
.opp .btn{margin-top:auto;width:100%}
.opp .st{font-size:13px;margin:0 0 10px;color:var(--p700);font-weight:500}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{border:1px solid var(--n200);border-radius:var(--r-md);padding:14px 6px;text-align:center}
.stat .ico{color:var(--p600);display:flex;justify-content:center;margin-bottom:4px}.stat strong{display:block;font-size:22px;line-height:30px}.stat small{display:block;font-size:12px;color:var(--n500)}
.ideas{margin-top:16px;border:1px solid var(--p300);background:linear-gradient(110deg,var(--p25),#fff);border-radius:var(--r-lg);padding:24px 28px;display:flex;align-items:center;justify-content:space-between;gap:24px}
.ideas h2{font-size:22px;color:var(--p900);margin-bottom:8px}.ideas p{margin:0 0 14px;color:var(--n700)}
.idea-types{display:flex;gap:12px;flex:1.5}.idea-type{flex:1;background:#fff;border:1px solid var(--p100);border-radius:var(--r-lg);padding:14px;text-align:center;font-weight:500;font-size:14px}
.idea-type .ico{color:var(--p600);display:flex;justify-content:center;margin-bottom:6px}
.bottom{margin-top:16px;padding:20px 28px;background:linear-gradient(90deg,var(--p50),var(--p100));border-radius:var(--r-lg);display:flex;justify-content:space-between;align-items:center;gap:20px}
.bottom h2{font-size:20px;margin-bottom:4px}.bottom p{margin:0;font-size:14px;color:var(--n700)}
.lvlbar{height:10px;background:var(--n200);border-radius:9999px;overflow:hidden}.lvlbar i{display:block;height:100%;background:var(--p600);border-radius:9999px}
/* stepper */
.stepper{display:flex;background:#fff;border:1px solid var(--n200);border-radius:var(--r-md);padding:16px 24px;margin-bottom:20px}
.step{flex:1;display:flex;flex-direction:column;align-items:flex-start;gap:8px;position:relative;padding:0 8px}
.step .row{display:flex;align-items:center;width:100%;gap:8px}
.step .dot{width:32px;height:32px;border-radius:50%;border:2px solid var(--n300);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:var(--n500);background:#fff;flex:none}
.step .line{height:2px;background:var(--n300);flex:1}
.step.done .dot{background:var(--p600);border-color:var(--p600);color:#fff}.step.done .line{background:var(--p600)}
.step.cur .dot{border-color:var(--p600);color:var(--p700);box-shadow:0 0 0 4px var(--p100)}
.step:last-child .line{display:none}.step:last-child{flex:none}.step .t1{white-space:nowrap}
.step .t1{font-size:16px;color:var(--n500)}.step .t2{font-size:14px;color:var(--n500);margin-top:-6px}
.step.done .t1,.step.cur .t1{color:var(--n900)}.step.done .t2,.step.cur .t2{color:var(--n700)}
.wiz-foot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--n200);margin-top:24px;padding-top:20px}
.wiz-foot .mid{font-size:14px;color:var(--n500)}
.terms{max-height:260px;overflow:auto;border:1px solid var(--n300);border-radius:var(--r-md);padding:16px;background:var(--n50);font-size:14px;line-height:26px}
.terms h4{margin-bottom:8px}
/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{background:var(--n100);text-align:start;padding:10px 12px;font-weight:600;border-bottom:1px solid var(--n300);white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--n200);vertical-align:middle}
.tbl tr:hover td{background:var(--n50)}
.tblw{overflow-x:auto;border:1px solid var(--n200);border-radius:var(--r-md);background:#fff}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{border:1px solid var(--n300);background:#fff;border-radius:9999px;padding:6px 14px;font-size:14px;font-weight:500;color:var(--n700)}
.chip.on{background:var(--p600);border-color:var(--p600);color:#fff}
.alert{display:flex;gap:10px;padding:12px 16px;border-radius:var(--r-md);border:1px solid;font-size:14px;line-height:22px;margin-bottom:16px;align-items:flex-start}
.alert.ok{background:var(--p50);border-color:var(--p300);color:var(--p800)}.alert.er{background:var(--err50);border-color:var(--err200);color:var(--err700)}.alert.wr{background:var(--gold50);border-color:var(--gold400);color:var(--warn700)}.alert.in{background:#eff8ff;border-color:var(--info100);color:var(--info700)}
.pend{display:inline-flex;gap:4px;align-items:center;font-size:12px;background:var(--gold50);border:1px dashed var(--gold);color:var(--warn700);border-radius:9999px;padding:1px 8px}
.bar-row{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:14px}.bar-row .n{width:170px;flex:none}.bar-row .b{flex:1;background:var(--n100);height:12px;border-radius:9999px;overflow:hidden}.bar-row .b i{display:block;height:100%;background:var(--p600)}.bar-row .c{width:30px;text-align:end;font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:20px}
.kpi{background:#fff;border:1px solid var(--n200);border-radius:var(--r-md);padding:16px}.kpi .v{font-size:28px;font-weight:600;line-height:36px;color:var(--p700)}.kpi .k{font-size:14px;color:var(--n500)}
.badge{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:16px 8px;border:1px solid var(--n200);border-radius:var(--r-md);background:#fff;font-size:14px}
.badge .medal{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff}
.badge.lock{opacity:.45;filter:grayscale(1)}
.badge.cur{border-color:var(--p600);box-shadow:0 0 0 3px var(--p100)}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.vid{aspect-ratio:16/9;background:linear-gradient(135deg,var(--p900),var(--n900));border-radius:var(--r-md);display:flex;align-items:center;justify-content:center;color:#fff}
.vid svg{width:64px;height:64px}
/* modal */
.mb{position:fixed;inset:0;background:rgba(13,18,28,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:200}
.md{background:#fff;border-radius:var(--r-lg);width:min(100%,560px);max-height:92vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.md.wide{width:min(100%,900px)}
.md .mh{display:flex;justify-content:space-between;align-items:center;padding:20px 24px 8px}
.md .mh h3{font-size:20px}
.md .mbody{padding:8px 24px 20px;color:var(--n700)}
.md .mf{display:flex;gap:12px;padding:16px 24px;border-top:1px solid var(--n200);justify-content:flex-start}
.x{background:none;border:0;color:var(--n500);display:flex;padding:4px;border-radius:6px}.x:hover{background:var(--n100)}
.icon-circ{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.icon-circ.er{background:var(--err50);color:var(--err600)}.icon-circ.ok{background:var(--p100);color:var(--p700)}.icon-circ.wr{background:var(--warn100);color:var(--warn700)}
.toast{position:fixed;bottom:76px;inset-inline-start:24px;background:var(--p950);color:#fff;padding:14px 18px;border-radius:var(--r-md);box-shadow:0 8px 25px rgba(0,0,0,.25);z-index:300;max-width:380px;font-size:14px}
/* gate */
.gate{display:grid;grid-template-columns:1fr 1fr;gap:20px;max-width:900px;margin:0 auto}
.gate .card{padding:28px}.gate h2{font-size:20px;margin-bottom:6px}.gate p{color:var(--n500);font-size:14px;margin:0 0 20px}
.gate .btn{margin-bottom:10px}
.center-card{max-width:520px;margin:0 auto}
.otp{display:flex;gap:12px;justify-content:center;direction:ltr;margin:16px 0}
.otp input{width:56px;height:60px;text-align:center;font-size:24px;font-weight:600;border:1px solid var(--n400);border-radius:var(--r-md)}
.otp input:focus{border-color:var(--p600);outline:none;box-shadow:0 0 0 3px var(--p100)}
.nafath-no{font-size:56px;font-weight:700;color:var(--p700);text-align:center;margin:16px 0;letter-spacing:4px}
.spin{width:28px;height:28px;border:3px solid var(--p100);border-top-color:var(--p600);border-radius:50%;animation:sp 1s linear infinite;margin:12px auto}
@keyframes sp{to{transform:rotate(360deg)}}
/* footer */
.foot{background:var(--n100);border-top:1px solid var(--n200);margin-top:48px;padding:40px 0 24px}
.foot .grp{display:grid;grid-template-columns:repeat(4,1fr);gap:32px}
.foot h4{font-size:16px;padding-bottom:8px;border-bottom:1px solid var(--n300);margin-bottom:12px}
.foot ul{list-style:none;margin:0;padding:0;font-size:14px;color:var(--n700)}.foot li{padding:5px 0}
.soc{display:flex;gap:8px;margin-bottom:16px}.soc span{width:34px;height:34px;border:1px solid var(--n300);border-radius:6px;background:#fff;display:flex;align-items:center;justify-content:center;color:var(--n700)}
.foot .legal{display:flex;justify-content:space-between;align-items:center;margin-top:28px;gap:24px;flex-wrap:wrap}
.foot .logos{display:flex;gap:20px;align-items:center}.foot .logos img.m{height:54px}.foot .logos img.d{height:56px}
.foot .ll{display:flex;gap:16px;font-size:13px;color:var(--n700);flex-wrap:wrap;margin-bottom:8px}
.foot .cp{font-size:13px;color:var(--n900);font-weight:500;max-width:460px}
.demo{position:fixed;bottom:16px;inset-inline-end:16px;z-index:150;background:var(--n950);color:#fff;border-radius:var(--r-lg);font-size:12px;box-shadow:0 10px 30px rgba(0,0,0,.38);max-width:calc(100vw - 24px);width:max-content;border:1px solid rgba(255,255,255,.14);overflow:hidden}
.demo b{margin-inline-end:4px}.demo button{background:#2a3445;border:0;color:#fff;border-radius:6px;padding:5px 9px;font-size:12px}.demo button.on{background:var(--p600)}
/* certificate */

{id:'c1',type:'article',pub:true,date:'2026-11-09',title:{ar:'كيف تكتب اقتراحًا يُؤخذ بجدية',en:'How to write a suggestion that gets taken seriously'},body:{ar:'يصل إلى فريق تجربة المستفيد عدد من المقترحات، وأكثرها فائدة هو الاقتراح الواضح الذي يمكن فهمه ومعالجته دون الحاجة إلى مراسلة صاحبه. هذا الدليل المختصر يساعدك على كتابة مقترح أقوى.\n\n## ابدأ بالخدمة والموقف\nحدّد الخدمة من دليل الخدمات في نما، ثم صف الموقف الذي واجهك: ماذا كنت تحاول أن تنجز؟ وفي أي خطوة توقفت أو تعثرت؟ وصف الموقف يعطي الفريق سياقًا لا تغني عنه العناوين العامة.\n\n## صف المشكلة قبل الحل\nاكتب ما حدث بالفعل بلغة بسيطة، ثم اقترح ما تراه مناسبًا. قد يكون الحل الذي تتخيله مختلفًا عمّا يناسب النظام، لكن وصفك للمشكلة هو ما يساعد الفريق على الوصول إلى الحل الأنسب.\n\n## نقاط تساعد على جودة المقترح\n- عنوان قصير يلخص الفكرة في سطر واحد.\n- مقترح واحد في كل مرة، فلا يُقبل مقترح جديد قبل مراجعة السابق.\n- تجنّب إدراج بيانات شخصية أو أرقام هوية في التفاصيل.\n- اذكر ما تتوقع أن يتحسن عند تنفيذ المقترح.\n\n## ماذا بعد الإرسال؟\nتصل مقترحاتك إلى فريق تجربة المستفيد فقط، ويستهدف الفريق مراجعتها خلال 7 أيام. وبعد المراجعة يُفتح لك إرسال مقترح جديد، ويُضاف إلى رصيدك في سجل نما التفاعلي.',en:'The UX team receives many suggestions, and the most useful ones are clear enough to understand and act on without contacting the sender. This short guide helps you write a stronger suggestion.\n\n## Start with the service and the situation\nPick the service from the NAAMA directory, then describe what you were trying to do and where you got stuck.\n\n## Describe the problem before the solution\nWrite what actually happened in plain language, then propose what you think would help. Your description of the problem is what lets the team find the best fix.\n\n## Tips for a good suggestion\n- A short title that sums up the idea in one line.\n- One suggestion at a time; a new one opens after the previous is reviewed.\n- Do not include personal data or ID numbers.\n- Say what you expect to improve.\n\n## What happens next?\nYour suggestion reaches the UX team only, which aims to review it within 7 days. Once reviewed, you can submit a new one, and it adds to your NAAMA interactive record.'}},
{id:'c2',type:'article',pub:true,date:'2026-11-06',title:{ar:'ما الذي يحدث بعد مشاركتك في ورشة؟',en:'What happens after you take part in a workshop?'},body:{ar:'تنتهي الورشة، لكن أثرها يبدأ. يوضح هذا المقال الرحلة التي تمرّ بها مشاركتك بعد انتهاء الجلسة، حتى تعرف أين تذهب ملاحظاتك وما الذي ستجده في حسابك.\n\n## تسجيل الحضور\nفي الورش عن بُعد تسجّل حضورك برمز أو رمز QR يعرضه فريق الورشة أثناء الجلسة. أما في الورش الحضورية فيسجّل الفريق حضور المعتمدين يدويًا من شاشته.\n\n## استبيان الرضا\nبعد الورشة يصلك استبيان قصير في سجل نما التفاعلي. إجاباتك تُجمع مع إجابات بقية المشاركين وتظهر في تقرير الرضا الذي يطّلع عليه الفريق.\n\n## ما الذي تحصل عليه؟\n- شهادة حضور باسم الورشة، قابلة للطباعة، وتحمل رقمًا تسلسليًا ورمزًا للتحقق.\n- نقاط تضاف إلى رصيدك عن الحضور وعن تعبئة الاستبيان.\n- ترقية مستواك وشارتك في سجل نما التفاعلي عند بلوغ الحد المطلوب.\n\n## كيف تُستخدم ملاحظاتك؟\nيلخّص الفريق نتائج كل ورشة في تقرير ينشر في قسم المحتوى، ويستفيد منه في ترتيب أولويات تحسين الخدمات.',en:'A workshop ends, but its impact begins. This article explains what happens to your participation after the session.\n\n## Recording attendance\nIn remote workshops you record attendance with a code or QR shown during the session. In onsite workshops the team records approved attendees manually.\n\n## Satisfaction survey\nAfter the workshop a short survey arrives in your NAAMA interactive record. Answers are combined with other participants\' and shown in the satisfaction report.\n\n## What you receive\n- A printable attendance certificate with the workshop name, a serial number and a verification code.\n- Points for attending and for completing the survey.\n- A level and badge upgrade once you reach the required threshold.\n\n## How your feedback is used\nThe team summarises each workshop in a report published in the Content section and uses it to prioritise service improvements.'}},
{id:'c3',type:'recording',pub:true,date:'2026-10-23',wid:'w6',title:{ar:'تسجيل ورشة عمل خدمات الآبار',en:'Recording: Wells services workshop'},body:{ar:'تسجيل كامل للورشة السابقة مع النقاشات.',en:'Full recording of the previous workshop with discussions.'}},
{id:'c4',type:'report',pub:true,date:'2026-11-05',wid:'w6',title:{ar:'نتائج وتوصيات ورشة عمل خدمات الآبار',en:'Results and recommendations: Wells services workshop'},body:{ar:'أبرز النتائج: تبسيط خطوة رفع المرفقات، وتوضيح رسائل الخطأ، وتقليل الحقول المكررة. وقد أُحيلت التوصيات إلى فريق التطوير.',en:'Key findings: simplify attachment upload, clarify error messages, reduce duplicated fields. Recommendations were passed to the development team.'}},
{id:'c5',type:'workshop',pub:true,date:'2026-10-22',wid:'w6',title:{ar:'ورشة عمل خدمات الآبار (منتهية)',en:'Wells services workshop (ended)'},body:{ar:'ورشة عن بُعد استمرت ساعة ونصفًا بمشاركة المستفيدين من خدمات حفر الآبار.',en:'A 90-minute remote workshop with beneficiaries of well drilling services.'}},
{id:'c7',type:'article',pub:true,date:'2026-11-11',title:{ar:'دليل الحضور الفعلي لمقر الوزارة',en:'Guide to attending onsite at the ministry'},body:{ar:'الورش الحضورية فرصة للحوار المباشر مع فريق تجربة المستفيد، ولها خطوات تنظيمية يوضحها هذا الدليل حتى تصل إلى القاعة دون عقبات.\n\n## من يمكنه التقديم؟\nالحضور الفعلي متاح للمستخدمين الموثّقين عبر نفاذ فقط، إذ يتطلب دخول مبنى الوزارة التحقق من الهوية.\n\n## خطوات التقديم\n- افتح الورشة من الصفحة الرئيسية واضغط «قدّم طلب المشاركة».\n- أكمل الخطوات الثلاث: الموافقة على الشروط، ثم بيانات المشارك، ثم مراجعة الطلب وإرساله.\n- يراجع فريق تجربة المستفيد الطلب ويعتمده بحسب المقاعد المتاحة.\n\n## قائمة الانتظار\nإذا اكتملت المقاعد يُضاف طلبك إلى قائمة الانتظار، وتصلك رسالة عند توفر مقعد.\n\n## التصريح الأمني\nعند الاعتماد يظهر لك رابط خدمة «حجز موعد» في نما ويصلك على بريدك. يُصدر التصريح الأمني خلال 3 أيام عمل، لذا قدّم على الخدمة مبكرًا قبل موعد الورشة.\n\n## يوم الورشة\nاحضر قبل الموعد بوقت كافٍ وأحضر هويتك الوطنية. يسجّل الفريق حضورك يدويًا، ثم يصلك الاستبيان وتظهر الشهادة في سجلك.',en:'Onsite workshops offer direct dialogue with the UX team. This guide covers the organisational steps so you arrive without obstacles.\n\n## Who can apply?\nOnsite attendance is available to Nafath-verified users only, because entering the ministry requires identity verification.\n\n## How to apply\n- Open the workshop from the home page and press "Request to attend".\n- Complete three steps: accept the terms, enter participant data, then review and submit.\n- The UX team reviews and approves according to available seats.\n\n## Waiting list\nIf seats are full your request joins the waiting list and you are notified when a seat opens.\n\n## Security permit\nOnce approved, the "Appointment booking" service link appears and is emailed to you. The permit takes 3 working days, so apply early.\n\n## On the day\nArrive early and bring your national ID. The team records your attendance manually, then the survey arrives and your certificate appears in your record.'}},
{id:'c8',type:'article',pub:true,date:'2026-11-12',title:{ar:'أثر مقترحات المستفيدين على الخدمات',en:'How beneficiary suggestions shape services'},body:{ar:'لا تنتهي المقترحات عند الإرسال. يشرح هذا المقال كيف يتعامل فريق تجربة المستفيد مع ما يصله، ولماذا يُعد صوت المستفيد مدخلًا أساسيًا في تطوير الخدمات الرقمية.\n\n## من القراءة إلى التحليل\nيقرأ الفريق كل مقترح ويربطه بالخدمة المعنية، ثم يجمع المقترحات المتشابهة ليتبيّن أي الخدمات تتكرر عليها الملاحظات.\n\n## من التحليل إلى الأولوية\nتُقاس أهمية الملاحظة بمدى تكرارها وأثرها على إنجاز المستفيد لطلبه. المقترحات التي تمس خطوات يتعثر فيها كثيرون تأخذ أولوية أعلى.\n\n## التنسيق مع فرق التطوير\nيرفع الفريق المقترحات المختارة إلى فريق التطوير ليقرر إمكانية تنفيذها ضمن خطة العمل، وتُنقل حاليًا يدويًا في ملف منظّم.\n\n## ما الذي تغيّره مشاركتك؟\n- تساعد على اكتشاف عقبات لا تظهر في الاختبارات الداخلية.\n- تدعم قرارات تبسيط الخطوات وتحسين الرسائل.\n- تُحتسب في رصيدك وتقرّبك من المستوى التالي.\n\nشكرًا لكل من شارك، ونتطلع إلى أفكارك القادمة.',en:'Suggestions do not end when sent. This article explains how the UX team handles them and why the beneficiary\'s voice is central to improving digital services.\n\n## From reading to analysis\nThe team reads each suggestion, links it to the relevant service and groups similar ones to see which services receive repeated feedback.\n\n## From analysis to priority\nImportance depends on how often an issue recurs and how much it affects task completion. Suggestions touching steps where many people struggle get higher priority.\n\n## Coordinating with development teams\nSelected suggestions go to the development team to decide whether they fit the work plan; for now they are handed over manually in a structured file.\n\n## What your participation changes\n- It reveals obstacles internal tests miss.\n- It supports decisions to simplify steps and improve messages.\n- It counts towards your points and next level.\n\nThank you to everyone who took part; we look forward to your next ideas.'}},

function me(){return S.user}

function person(id){return D.people.filter(function(p){return p.id===id})[0]}

function uid(p){return p+Math.random().toString(36).slice(2,8)}
function fmtDate(d){var m=[['يناير','Jan'],['فبراير','Feb'],['مارس','Mar'],['أبريل','Apr'],['مايو','May'],['يونيو','Jun'],['يوليو','Jul'],['أغسطس','Aug'],['سبتمبر','Sep'],['أكتوبر','Oct'],['نوفمبر','Nov'],['ديسمبر','Dec']];var a=d.split('-');return +a[2]+' '+t(m[+a[1]-1][0],m[+a[1]-1][1])+' '+a[0]}
function pts(pid){var a=D.att.filter(function(x){return x.pid===pid}).length,s=D.surveys.filter(function(x){return x.pid===pid&&x.done}).length,g=D.sugg.filter(function(x){return x.pid===pid}).length;return a*D.cfg.attend+s*D.cfg.survey+g*D.cfg.suggest+(window.stPts?stPts(pid):0)}
function lvls(){return D.levels.slice().sort(function(a,b){return a.min-b.min})}
function lvlOf(p){var r=lvls()[0];lvls().forEach(function(l){if(p>=l.min)r=l});return r}
function nextLvl(p){var r=null;lvls().forEach(function(l){if(!r&&l.min>p)r=l});return r}
function seatsApproved(w){return D.reqs.filter(function(q){return q.wid===w.id&&q.status==='approved'}).length+(w.seedApproved||0)}
function regCount(w){return D.regs.filter(function(r){return r.wid===w.id}).length+(w.seedReg||0)}
function directStat(w){var n=D.regs.filter(function(r){return r.wid===w.id&&r.direct}).length,tot=regCount(w);return {n:n,tot:tot,pct:tot?n/tot*100:0}}
function directAlert(w){if(w.type!=='remote'||w.status==='cancelled')return false;var s=directStat(w);return s.n>0&&s.pct>D.cfg.djAlert}
function wdOf(w){return (D.wd||[]).filter(function(x){return x.wid===w.id})}
function wdRate(){var wd=(D.wd||[]).length,den=D.regs.length+D.reqs.filter(function(q){return q.status==='approved'}).length+wd;return den?Math.round(wd/den*100):0}
function audience(w){var ids=w.type==='remote'?D.regs.filter(function(r){return r.wid===w.id}).map(function(r){return r.pid}):D.reqs.filter(function(q){return q.wid===w.id&&(q.status==='approved'||q.status==='pending'||q.status==='waitlist')}).map(function(q){return q.pid});return ids.filter(function(x,i){return ids.indexOf(x)===i})}
function myReg(w){return me()&&D.regs.filter(function(r){return r.wid===w.id&&r.pid===me().pid})[0]}
function myReq(w){return me()&&D.reqs.filter(function(q){return q.wid===w.id&&q.pid===me().pid})[0]}
function attended(w,pid){return D.att.some(function(a){return a.wid===w.id&&a.pid===pid})}

return '<svg viewBox="0 0 21 21" width="'+size+'" height="'+size+'" shape-rendering="crispEdges" role="img" aria-label="QR"><rect width="21" height="21" fill="#fff"/>'+o+fin(0,0)+fin(14,0)+fin(0,14)+'</svg>'}

var HF=new Intl.DateTimeFormat('en-u-ca-islamic-umalqura',{year:'numeric',month:'numeric',day:'numeric'});
function pad2(n){return (n<10?'0':'')+n}
function isoOf(d){return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())}
function parseIso(s){var a=s.split('-');return new Date(+a[0],+a[1]-1,+a[2],12)}
function toH(d){var o={};HF.formatToParts(d).forEach(function(p){if(p.type==='year'||p.type==='month'||p.type==='day')o[p.type==='year'?'y':p.type==='month'?'m':'d']=+p.value});return o}

function mName(d,h){return new Intl.DateTimeFormat(dpLoc(h),{month:'long'}).format(d)}

function dpDays(){var a=parseIso(S.dp.anchor),x,days=[];

function sanitize(html){var tpl=document.createElement('template');tpl.innerHTML=html||'';

function clean(n,out){Array.prototype.forEach.call(n.childNodes,function(c){if(c.nodeType===3){out.appendChild(document.createTextNode(c.nodeValue));return}if(c.nodeType!==1)return;var tg=c.tagName;
if(!OK[tg]){if(/^(SCRIPT|STYLE|IFRAME|OBJECT|EMBED|FORM|INPUT|BUTTON|SVG|MATH)$/.test(tg))return;clean(c,out);return}
var e=document.createElement(tg.toLowerCase());
if(tg==='A'){var h=(c.getAttribute('href')||'').trim();if(!/^(https?:\/\/|mailto:)/i.test(h)){clean(c,out);return}e.setAttribute('href',h);e.setAttribute('target','_blank');e.setAttribute('rel','noopener noreferrer')}
if(tg==='IMG'){var s=(c.getAttribute('src')||'').trim();if(!/^(https:\/\/|data:image\/(png|jpe?g|gif|webp);base64,)/i.test(s))return;e.setAttribute('src',s);e.setAttribute('alt',c.getAttribute('alt')||'')}
clean(c,e);out.appendChild(e)})}

function header(){

var left='<a data-a="lang">'+ic('globe','sm')+(L.v==='ar'?'English':'العربية')+'</a>';
if(u)left='<a data-a="logout" class="out">'+ic('logout','sm')+t('تسجيل الخروج','Sign out')+'</a>'+left+(isPart()?'<a data-a="go" data-r="notes" aria-label="'+t('الإشعارات','Notifications')+'">'+ic('bell','sm')+(n?'<span class="tag red">'+n+'</span>':'')+'</a>':'');
else left='<a data-a="go" data-r="login">'+ic('user','sm')+t('تسجيل الدخول','Sign in')+'</a>'+left;
var right='<div class="gov"><span class="flag"></span><span class="t">'+t('موقع حكومي مسجل لدى هيئة الحكومة الرقمية','A government website registered with the Digital Government Authority')+'</span><a data-a="toast" data-m="'+t('خارج نطاق النموذج','Outside prototype scope')+'">'+ic('chevd','sm')+t('كيف تتحقق؟','How to verify?')+'</a></div>';
var uc=u?'<div class="userchip"><span class="tag '+(isStaff()?'gold':(u.verified?'':'gray'))+'">'+(isStaff()?t('موظف','Staff'):(u.verified?t('موثّق بنفاذ','Verified (Nafath)'):t('مسجل زائر','Visitor registrant')))+'</span><b>'+esc(u.name)+'</b></div>':'';
var topbar='<div class="topbar"><div class="wrap"><div class="links">'+uc+left+'</div>'+(isStaff()?'':right)+'</div></div>';
var items=[['home',t('الرئيسية','Home')],['x1',t('دليل الخدمات الإلكترونية','E-services directory')],['x2',t('الأخبار والأحداث','News & events')],['x3',t('عن نما','About NAAMA')],['x4',t('الأسئلة الشائعة','FAQ')],['x5',t('تواصل معنا','Contact us')]];
if(isStaff())return topbar+staffNav();
var nav='<div class="mainnav"><div class="wrap"><div class="logo" data-a="go" data-r="home"><img src="'+IMG.naama+'" alt="'+t('نما','NAAMA')+'"></div><nav class="navl" aria-label="main">'+items.slice(0,3).map(navX).join('')+'<a class="on" data-a="go" data-r="'+(isStaff()?'s-dash':'home')+'">'+t('مجتمع نما الرقمي','NAAMA Digital Community')+'</a>'+items.slice(3).map(navX).join('')+'</nav><div class="srch"><input aria-label="'+t('بحث','Search')+'" placeholder="'+t('ابحث هنا ....','Search here ....')+'">'+ic('search','sm')+'</div></div></div>';
return topbar+nav+subnav()}
function staffItems(){return [['s-dash','chart',t('لوحة المؤشرات','Dashboard')],['s-ws','calendar',t('إدارة الورش','Workshops')],['s-cal','calendar',t('التقويم والفعاليات','Calendar & events')],['s-ppl','users',t('إدارة المشاركين','Participants')],['s-reg','users',t('المسجلون والحضور','Registrants & attendance')],['s-req','shield',t('طلبات الحضور الفعلي','Onsite requests')],['s-svy','msg',t('إدارة الاستبيانات','Surveys')],['s-sug','bulb',t('الاقتراحات','Suggestions')],['s-sto','msg',t('تجارب المشاركين','Participant experiences')],['s-con','file',t('إدارة المحتوى','Content')],['s-bad','award',t('الشارات والمستويات','Badges & levels')],['s-set','settings',t('إعدادات المنصة','Platform settings')]]}

function sideTree(){var r=S.route==='s-reqd'?'s-req':S.route==='s-sugd'?'s-sug':S.route==='s-pd'?(S.pdFrom?(S.pdFrom.kind==='sug'?'s-sug':'s-sto'):'s-ppl'):S.route==='s-form'&&S.pgf?PGF[S.pgf.type][0]:S.route,cn=sideCounts(),it={};staffItems().forEach(function(x){it[x[0]]=x});

['g-ev',1,'calendar',t('الورش والفعاليات','Workshops & events'),['s-ws','s-cal']],
['g-pt',1,'users',t('المشاركون','Participants'),['s-ppl','s-reg','s-req']],
['g-ix',1,'bulb',t('التفاعل والمحتوى','Engagement & content'),['s-svy','s-sug','s-sto','s-con']],

['g-st',1,'settings',t('الإعدادات','Settings'),['s-set']]];
function leaf(k,root){var x=it[k],n=cn[k];return '<a class="tl'+(root?' root':'')+(r===k?' on':'')+'" data-a="go" data-r="'+k+'" role="treeitem"'+(r===k?' aria-current="page"':'')+'>'+(root?ic(x[1],'sm'):'<i class="dot"></i>')+'<span>'+x[2]+'</span>'+(n?'<b class="cnt" aria-label="'+n+' '+t('بانتظار الإجراء','awaiting action')+'">'+n+'</b>':'')+'</a>'}
var h=G.map(function(g){if(!g[1])return leaf(g[4][0],true);

return '<div class="tg'+(open?' open':'')+(hot?' hot':'')+'" role="none"><button type="button" class="tgh" data-a="treeTog" data-g="'+g[0]+'" aria-expanded="'+open+'">'+ic(g[2],'sm')+'<span>'+g[3]+'</span>'+(!open&&tot?'<b class="cnt">'+tot+'</b>':'')+ic(open?'chevd':(L.v==='ar'?'chevl':'chevr'),'sm')+'</button>'+(open?'<div class="tgb" role="group">'+g[4].map(function(k){return leaf(k,false)}).join('')+'</div>':'')+'</div>'}).join('');

function wfF(){if(!S.wf)S.wf={q:'',ty:'',st:'',ac:'',df:'',dt:'',sv:''};return S.wf}
function wfRead(){var f=wfF();['q','ty','st','ac','df','dt','sv'].forEach(function(k){var e=document.getElementById('wf-'+k);if(e)f[k]=e.value})}
function wfList(){var f=wfF(),q=f.q.trim().toLowerCase(),sv=f.sv.trim().toLowerCase();return D.ws.filter(function(w){
if(q&&(w.title.ar+' '+w.title.en).toLowerCase().indexOf(q)<0)return false;
if(f.ty&&w.type!==f.ty)return false;if(f.st&&w.status!==f.st)return false;
if(f.ac==='on'&&!wsOn(w))return false;if(f.ac==='off'&&wsOn(w))return false;
if(f.df&&w.date<f.df)return false;if(f.dt&&w.date>f.dt)return false;
if(sv&&!wsSvcs(w).some(function(id){var c=SERVICES.filter(function(x){return x[0]===id})[0];return c&&(c[1]+' '+c[2]).toLowerCase().indexOf(sv)>=0}))return false;return true})}
function wfCount(){return t('عرض ','Showing ')+wfList().length+t(' من ',' of ')+D.ws.length+t(' ورشة',' workshops')}
function wfRows(){var L2=wfList();return L2.length?L2.map(wsRowH).join(''):'<tr><td colspan="7" class="help">'+t('لا توجد ورش مطابقة لمعايير البحث','No workshops match the search criteria')+'</td></tr>'}
function wfRefresh(){var tb=document.getElementById('ws-body');if(tb)tb.innerHTML=wfRows();var c=document.getElementById('wf-n');if(c)c.textContent=wfCount()}
ACT.wfReset=function(){S.wf=null;render()};

return '<div class="card pad" style="margin-bottom:16px"><div style="display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end"><div style="min-width:220px;flex:2">'+field('wf-q',t('بحث بعنوان الورشة','Search by title'),{v:f.q,help:t('بالعربي أو الإنجليزي','Arabic or English')})+'</div>'+
sel('wf-ty',t('النوع','Type'),f.ty,[['remote',t('عن بُعد','Remote')],['onsite',t('حضوري','Onsite')]])+
sel('wf-st',t('الحالة','Status'),f.st,[['soon',t('قريبًا','Coming soon')],['open',t('التسجيل مفتوح','Registration open')],['live',t('جارية','Live')],['ended',t('منتهية','Ended')],['cancelled',t('ملغاة','Cancelled')]])+
sel('wf-ac',t('التفعيل','Activation'),f.ac,[['on',t('مفعّلة','Active')],['off',t('مسودة','Draft')]])+'</div>'+
'<div style="display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-top:4px"><div style="min-width:170px;flex:1">'+field('wf-df',t('من تاريخ','From date'),{type:'date',v:f.df,ltr:1})+'</div><div style="min-width:170px;flex:1">'+field('wf-dt',t('إلى تاريخ','To date'),{type:'date',v:f.dt,ltr:1})+'</div><div style="min-width:240px;flex:2">'+field('wf-sv',t('الخدمة المرتبطة','Related service'),{v:f.sv,help:t('جزء من اسم الخدمة','Part of the service name')})+'</div><div style="padding-bottom:22px"><button class="btn out" data-a="wfReset">'+t('مسح المعايير','Clear criteria')+'</button></div></div><div class="help" id="wf-n" style="margin:0" aria-live="polite">'+wfCount()+'</div></div>'}
function wsRowH(w){return '<tr><td>'+esc(tl(w.title))+'</td><td>'+tyTag(w)+(w.direct?' <span class="tag gold">'+t('انضمام مباشر','Direct join')+'</span>':'')+(directAlert(w)?' <span class="tag red" title="'+esc(t('نسبة الانضمام المباشر تتجاوز الحد المحدد في الإعدادات','Direct-join share exceeds the limit set in Settings'))+'">'+ic('alert','sm')+t('مرتفعة','High share')+'</span>':'')+(w.resched?' <span class="tag gold">'+t('تغيّر موعدها','Rescheduled')+'</span>':'')+(w.from?' <span class="tag">'+t('أُعيد طرحها','Re-offered')+'</span>':'')+(w.deck?' <span class="tag gray" title="'+esc(w.deck.name)+'">'+ic('file','sm')+t('عرض مرفق','Deck attached')+'</span>':'')+'</td><td style="white-space:nowrap">'+fmtDate(w.date)+'</td><td style="white-space:nowrap"><bdi dir="ltr">'+(w.type==='onsite'?seatsApproved(w):regCount(w))+' / '+w.cap+'</bdi></td><td style="white-space:nowrap">'+stTag(w)+((w.status==='live'||w.status==='ended')?'<div class="help" style="margin:2px 0 0;font-size:12px">'+t('تلقائيًا بالتوقيت','Set by schedule')+'</div>':'')+'</td><td>'+(w.status==='ended'?'<span class="help">'+t('أُزيلت من المنصة تلقائيًا','Removed automatically')+'</span>':'<button type="button" class="swb'+(wsOn(w)?' on':'')+'" role="switch" aria-checked="'+wsOn(w)+'" data-a="wsAct" data-id="'+w.id+'" aria-label="'+esc(t('تفعيل الورشة في المنصة','Activate on the platform')+': '+tl(w.title))+'"><i></i></button><div class="help" style="margin:2px 0 0;font-size:12px">'+(wsOn(w)?t('مفعّلة','Active'):t('مسودة','Draft'))+'</div>')+'</td><td>'+(w.status==='cancelled'?'<span class="help">'+t('ملغاة','Cancelled')+'</span>':'<div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:320px;margin-inline-start:auto">'+(w.status==='ended'?'<button class="btn pri sm" data-a="wsRe" data-id="'+w.id+'" title="'+esc(t('نسخ بيانات الورشة إلى ورشة جديدة بتاريخ جديد','Copy this workshop into a new one with a new date'))+'">'+ic('swap','sm')+t('إعادة طرح','Re-offer')+'</button>':'<button class="btn out sm" data-a="wsEdit" data-id="'+w.id+'">'+ic('edit','sm')+t('تعديل','Edit')+'</button>')+(w.status==='soon'?' <button class="btn out sm" data-a="wsSta" data-id="'+w.id+'">'+t('فتح التسجيل','Open registration')+'</button>':'')+(w.status==='open'||w.status==='soon'?' <button class="btn out sm" data-a="wsRes" data-id="'+w.id+'">'+ic('calendar','sm')+t('تغيير الموعد','Reschedule')+'</button>':'')+((w.status==='open'||w.status==='soon')?' <button class="btn dng sm" data-a="wsCan" data-id="'+w.id+'">'+t('إلغاء الورشة','Cancel workshop')+'</button>':'')+'</div>')+'</td></tr>'}
function svInit(w){S.sv={sel:w?wsSvcs(w).slice():[],q:'',p:1,only:false};S.deck={cur:w&&w.deck?w.deck:null}}
ACT.wsNew=function(){svInit(null);modal('wsForm',{})};ACT.wsRe=function(d){svInit(ws(d.id));modal('wsForm',{re:d.id})};

ACT.wsAct=function(d){var w=ws(d.id);if(!w||w.status==='ended')return;if(wsOn(w)){var n=audience(w).length;if(n){confirmModal({title:t('إيقاف تفعيل الورشة','Deactivate workshop'),msg:t('ستختفي الورشة من المنصة للمشاركين، ولدى «','The workshop will be hidden from participants. “')+tl(w.title)+t('» ','” has ')+n+t(' مشارك/طلب مرتبط بها. هل تريد المتابعة؟',' linked participants/requests. Continue?'),ok:t('إيقاف التفعيل','Deactivate'),act:'wsActOk',args:{id:w.id},kind:'er'});return}}ACT.wsActOk({id:d.id})};
ACT.wsActOk=function(d){var w=ws(d.id);if(!w)return;w.active=!wsOn(w);aud((w.active?'تفعيل':'إيقاف تفعيل')+' الورشة «'+w.title.ar+'»');S.modal=null;render();toast(w.active?t('تم تفعيل الورشة وهي ظاهرة الآن في المنصة','Workshop activated and now visible on the platform'):t('تم إيقاف التفعيل — الورشة مخفية عن المشاركين','Deactivated — hidden from participants'))};
ACT.wsSta=function(d){var w=ws(d.id);if(w.status!=='soon'){toast(t('حالتا «جارية» و«منتهية» تُضبطان تلقائيًا بحسب توقيت الورشة','The “Live” and “Ended” statuses are set automatically by the workshop schedule'));return}confirmModal({title:t('فتح التسجيل','Open registration'),msg:t('سيتغير حالة «','The status of “')+tl(w.title)+t('» إلى «التسجيل مفتوح». تصبح الحالة «جارية» ثم «منتهية» تلقائيًا بحسب التوقيت ولا يمكن تغييرها يدويًا.','” will become “Registration open”. It then becomes “Live” and “Ended” automatically by the schedule and cannot be changed manually.'),ok:t('فتح التسجيل','Open registration'),act:'wsStaOk',args:{id:w.id},kind:'ok'})};
ACT.wsStaOk=function(d){var w=ws(d.id);if(w.status!=='soon'){S.modal=null;render();return}w.status='open';aud('فتح التسجيل في الورشة «'+w.title.ar+'»');S.modal=null;render();toast(t('تم فتح التسجيل','Registration opened'))};
MODALS.wsRes=function(d){var w=ws(d.id),n=audience(w).length;
return '<div class="mh"><h3>'+t('تغيير موعد الورشة','Reschedule workshop')+'</h3><button class="x" data-a="mclose" aria-label="'+t('إغلاق','Close')+'">'+ic('x')+'</button></div><div class="mbody"><p style="margin-top:0"><b>'+esc(tl(w.title))+'</b><br><span class="help" style="margin:0">'+t('الموعد الحالي: ','Current schedule: ')+fmtDate(w.date)+' · <bdi dir="ltr">'+esc(w.time)+'</bdi></span></p><div class="grid2">'+field('wr-d',t('التاريخ الجديد','New date'),{type:'date',v:w.date,req:1})+field('wr-tm',t('الوقت الجديد','New time'),{v:w.time,ltr:1,req:1,help:t('مثال: 10:00 - 11:30','Example: 10:00 - 11:30')})+'</div>'+field('wr-r',t('سبب تغيير الموعد','Reason for the change'),{type:'textarea',req:1,max:200,help:t('يظهر السبب للمشاركين في الإشعار وصفحة الورشة','Shown to participants in the notification and on the workshop page')})+'<div class="alert in">'+ic('bell')+'<div>'+t('سيُرسل إشعار تلقائي إلى ','An automatic notification will be sent to ')+'<b>'+n+'</b> '+t('مشارك مسجّل.',' registered participants.')+(w.type==='onsite'?' '+t('وسيُطلب من المعتمدين إعادة حجز موعد التصريح الأمني وفق الموعد الجديد.','Approved attendees will be asked to re-book the security permit appointment for the new date.'):'')+'</div></div></div><div class="mf"><button class="btn pri" data-a="wsResOk" data-id="'+w.id+'">'+t('تأكيد التغيير وإشعار المسجلين','Confirm and notify participants')+'</button><button class="btn out" data-a="mclose">'+t('رجوع','Back')+'</button></div>'};
ACT.wsRes=function(d){var w=ws(d.id);if(w.status!=='open'&&w.status!=='soon'){toast(t('لا يمكن تغيير موعد ورشة جارية أو منتهية أو ملغاة','Cannot reschedule a live, ended or cancelled workshop'));return}modal('wsRes',{id:d.id})};
ACT.wsResOk=function(d){clearErr();var w=ws(d.id),dt=val('wr-d'),tm=val('wr-tm'),rs=val('wr-r'),ok=true;
if(!dt){setErr('wr-d',t('هذا الحقل إلزامي','Required'));ok=false}else if(dt<TODAY){setErr('wr-d',t('يجب أن يكون التاريخ اليوم أو بعده','The date must be today or later'));ok=false}
if(!tm){setErr('wr-tm',t('هذا الحقل إلزامي','Required'));ok=false}
if(!rs){setErr('wr-r',t('أدخل سبب تغيير الموعد','Enter the reason'));ok=false}
if(ok&&dt===w.date&&tm===w.time){setErr('wr-d',t('لم يتغير الموعد؛ اختر تاريخًا أو وقتًا مختلفًا','The schedule did not change; choose a different date or time'));ok=false}
if(!ok)return;
var fd=w.date,ft=w.time,ids=audience(w);w.resched={fd:fd,ft:ft,ts:TODAY,reason:rs};w.date=dt;w.time=tm;
ids.forEach(function(pid){notify(pid,'تم تغيير موعد «'+w.title.ar+'» من '+fmtDate(fd)+' ('+ft+') إلى '+fmtDate(dt)+' ('+tm+'). السبب: '+rs+(w.type==='onsite'?' يرجى إعادة حجز موعد التصريح الأمني وفق الموعد الجديد.':''),'“'+w.title.en+'” was rescheduled from '+fd+' ('+ft+') to '+dt+' ('+tm+'). Reason: '+rs+(w.type==='onsite'?' Please re-book the security permit appointment for the new date.':''))});
aud('تغيير موعد «'+w.title.ar+'» من '+fd+' إلى '+dt+' وإشعار '+ids.length+' مشارك');S.modal=null;render();toast(t('تم تغيير الموعد وإشعار ','Rescheduled and notified ')+ids.length+t(' مشارك',' participants'))};
MODALS.wsCan=function(d){var w=ws(d.id),n=audience(w).length;
return '<div class="mh"><div><div class="icon-circ er">'+ic('alert','lg')+'</div><h3>'+t('إلغاء الورشة','Cancel workshop')+'</h3></div><button class="x" data-a="mclose" aria-label="'+t('إغلاق','Close')+'">'+ic('x')+'</button></div><div class="mbody"><p style="margin-top:0">'+t('سيتم إلغاء «','You are about to cancel “')+'<b>'+esc(tl(w.title))+'</b>'+t('» ولا يمكن التراجع عن الإلغاء.','”. This cannot be undone.')+'</p>'+field('wc-r',t('سبب الإلغاء','Reason for cancellation'),{type:'textarea',req:1,max:200,help:t('يظهر السبب للمشاركين في الإشعار وصفحة الورشة','Shown to participants in the notification and on the workshop page')})+'<div class="alert wr">'+ic('bell')+'<div>'+t('سيُرسل إشعار تلقائي إلى ','An automatic notification will be sent to ')+'<b>'+n+'</b> '+t('مشارك مسجّل، وتتوقف الورشة عن استقبال التسجيل والحضور.',' registered participants, and the workshop stops accepting registration and attendance.')+'</div></div></div><div class="mf"><button class="btn dngs" data-a="wsCanOk" data-id="'+w.id+'">'+t('تأكيد الإلغاء وإشعار المسجلين','Confirm and notify participants')+'</button><button class="btn out" data-a="mclose">'+t('رجوع','Back')+'</button></div>'};
ACT.wsCan=function(d){var w=ws(d.id);if(w.status!=='open'&&w.status!=='soon'){toast(t('لا يمكن إلغاء ورشة جارية أو منتهية أو ملغاة','Cannot cancel a live, ended or already-cancelled workshop'));return}modal('wsCan',{id:d.id})};
ACT.wsCanOk=function(d){clearErr();var w=ws(d.id),rs=val('wc-r');if(w.status!=='open'&&w.status!=='soon'){S.modal=null;render();return}if(!rs){setErr('wc-r',t('أدخل سبب الإلغاء','Enter the reason'));return}
if(w.status==='ended'||w.status==='cancelled'){S.modal=null;render();return}
var ids=audience(w);w.status='cancelled';w.cancel={reason:rs,ts:TODAY};
ids.forEach(function(pid){notify(pid,'نأسف، تم إلغاء «'+w.title.ar+'». السبب: '+rs+(w.type==='onsite'?' ولا حاجة لإتمام التصريح الأمني.':''),'We are sorry, “'+w.title.en+'” was cancelled. Reason: '+rs+(w.type==='onsite'?' No security permit is needed.':''))});
aud('إلغاء «'+w.title.ar+'» وإشعار '+ids.length+' مشارك');S.modal=null;render();toast(t('تم إلغاء الورشة وإشعار ','Workshop cancelled and notified ')+ids.length+t(' مشارك',' participants'))};
function fmtSize(n){return n>=1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB'}

function dkPick(f){var h=document.getElementById('dk-h');var err=function(m){if(h){h.className='errm';h.innerHTML=ic('alert','sm')+esc(m)}};if(!f)return;if(!/\.(pdf|pptx?|PDF|PPTX?)$/.test(f.name)){err(t('الصيغة غير مدعومة. اختر ملف PDF أو PowerPoint (‎.pdf, .ppt, .pptx).','Unsupported format. Choose a PDF or PowerPoint file (.pdf, .ppt, .pptx).'));return}if(f.size>15*1048576){err(t('حجم الملف أكبر من 15 ميجابايت.','The file is larger than 15 MB.'));return}if(f.size===0){err(t('الملف فارغ.','The file is empty.'));return}
S.deck.cur={name:f.name,size:f.size,url:(window.URL&&URL.createObjectURL)?URL.createObjectURL(f):''};var b=document.getElementById('dk-body');if(b)b.innerHTML=dkBody()}

var SV_PS=8;

function stDaysVal(){var v=val('sd-d');if(!/^\d{1,3}$/.test(v)||+v<1||+v>365){setErr('sd-d',t('أدخل عدد أيام من 1 إلى 365','Enter a number of days from 1 to 365'));return null}return +v}
ACT.stPub=function(d){clearErr();var s=stOf(d.id),tx=val('sd-b');if(!tx||tx.length<20){setErr('sd-b',t('النص قصير جدًا للنشر','The text is too short to publish'));return}
var dy=stDaysVal();if(!dy)return;var edited=tx!==s.text;s.text=tx;s.days=dy;s.status='published';s.pubAt=curDate();stPublish(s);aud('نشر تجربة المشارك '+person(s.pid).name+' «'+s.title+'»'+(edited?' بعد تعديل الصياغة':''));
notify(s.pid,'تم نشر تجربتك «'+s.title+'» في مركز المعرفة وتُعرض لمدة '+dy+' يومًا. شكرًا لمشاركتك، وأُضيفت '+D.cfg.story+' نقطة إلى رصيدك.','Your experience “'+s.title+'” is published in the Knowledge Hub for '+dy+' days. Thank you for sharing; '+D.cfg.story+' points were added to your balance.');
closeModal();render();toast(t('تم نشر التجربة وإشعار المشارك','Published and the participant was notified'))};
ACT.stDays=function(d){clearErr();var s=stOf(d.id),dy=stDaysVal();if(!dy)return;var tx=val('sd-b');if(tx&&tx.length>=20&&tx!==s.text){s.text=tx;stPublish(s)}s.days=dy;if(stExp(s)<=curDate()){stEndNow(s);closeModal();render();toast(t('انتهت المدة المحددة فأُنهي العرض','The period has already passed; display ended'));return}aud('تعديل مدة عرض تجربة المشارك '+person(s.pid).name+' «'+s.title+'» إلى '+dy+' يومًا');closeModal();render();toast(t('تم حفظ التعديلات','Saved'))};
function stEndNow(s){s.status='ended';stUnpublish(s);aud('إنهاء عرض تجربة المشارك '+person(s.pid).name+' «'+s.title+'»')}
ACT.stEnd=function(d){var s=stOf(d.id);stEndNow(s);closeModal();render();toast(t('تم إنهاء العرض','Display ended'))};
ACT.stDelS=function(d){var s=stOf(d.id);confirmModal({title:t('حذف التجربة','Delete experience'),msg:t('ستُحذف التجربة «','The experience “')+s.title+(s.status==='pending'||s.status==='draft'?t('» نهائيًا من المنصة. هل تريد المتابعة؟','” will be permanently deleted. Continue?'):t('» نهائيًا من المنصة، وتُخصم نقاطها من المشارك. هل تريد المتابعة؟','” will be permanently deleted and its points deducted from the participant. Continue?')),ok:t('حذف نهائي','Delete permanently'),act:'stDelSOk',args:{id:d.id},kind:'er'})};
ACT.stDelSOk=function(d){var s=stOf(d.id);if(!s)return;aud('حذف تجربة المشارك '+person(s.pid).name+' «'+s.title+'» نهائيًا');stUnpublish(s);D.stories=D.stories.filter(function(x){return x.id!==d.id});S.modal=null;render();toast(t('تم حذف التجربة','Experience deleted'))};

function didPublish(x,ti,bd){var c={id:'cd_'+x.id,type:'did',pub:true,date:TODAY,sugId:x.id,views:0,author:'',title:{ar:ti,en:ti},body:{ar:bd,en:bd},html:{ar:stHtml(bd),en:stHtml(bd)}};D.content=D.content.filter(function(k){return k.id!==c.id});D.content.unshift(c);return c}
ACT.sugImplOk=function(d){clearErr();var x=sugOf(d.id),ti=val('si-t'),bd=val('si-b'),ok=true;if(!ti){setErr('si-t',t('هذا الحقل إلزامي','Required'));ok=false}if(!bd){setErr('si-b',t('هذا الحقل إلزامي','Required'));ok=false}if(!ok)return;

closeModal();render();toast(t('تم النشر في مركز المعرفة وإشعار المشارك','Published and the participant was notified'))};
ACT.sugImplUn=function(d){var x=sugOf(d.id);D.content=D.content.filter(function(k){return k.id!==x.implCid});x.impl=false;x.implCid=null;aud('إلغاء نشر «صوتك أحدث فرقًا» لاقتراح «'+x.title+'»');render();toast(t('أُلغي النشر','Unpublished'))};
function sugImplCard(x){if(!x.reviewed)return '';
if(x.impl)return '<div class="card pad" style="margin-top:16px"><h2 class="sec-t">'+t('صوتك أحدث فرقًا','Your voice made a difference')+'</h2><div class="alert ok" style="margin-top:12px">'+ic('check')+'<div>'+t('نُشر تنفيذ هذا الاقتراح في مركز المعرفة.','The implementation of this suggestion is published in the Knowledge Hub.')+'</div></div><div style="margin-top:12px"><button class="btn out" data-a="sugImplUn" data-id="'+x.id+'">'+t('إلغاء النشر','Unpublish')+'</button></div></div>';
return '<div class="card pad" style="margin-top:16px"><h2 class="sec-t">'+t('صوتك أحدث فرقًا','Your voice made a difference')+'</h2><p class="ps" style="margin:8px 0 0">'+t('إذا نُفّذ هذا الاقتراح أو أُخذ به في تحسين الخدمة، انشر ذلك ليرى المستفيدون أن آراءهم تصنع فرقًا. يصل صاحب الاقتراح إشعار خاص.','If this suggestion was implemented or used to improve a service, publish it so beneficiaries see that their feedback makes a difference. The suggester gets a private notification.')+'</p><div style="margin-top:14px"><button class="btn pri" data-a="sugImpl" data-id="'+x.id+'">'+ic('check','sm')+t('تم تنفيذ الاقتراح، انشر «صوتك أحدث فرقًا»','Implemented: publish “Your voice made a difference”')+'</button></div></div>'}

if(el.classList.contains('dis')&&n!=='toast'){return}
var d={};for(var i=0;i<el.attributes.length;i++){var a=el.attributes[i];if(a.name.indexOf('data-')===0&&a.name!=='data-a')d[a.name.slice(5)]=a.value}
S.last={n:n,d:d};ACT[n](d,el,ev)});
